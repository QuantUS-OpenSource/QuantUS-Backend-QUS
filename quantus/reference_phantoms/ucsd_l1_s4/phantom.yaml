name: UCSD L1 / S4
description: >
  Calibrated by the UW-Madison Quantitative Ultrasound Lab (Rosado-Mendez),
  QULReport_UCSD_09112025.pdf (UW-Madison QUL, report date 2025-09-11).
  The report covers phantoms UCSD-L1 and UCSD-S4 with a single characterized sample; these values apply to both.

# attenuation(f) = coef * f_MHz^exp + offset   [dB/cm]
# Power-law least-squares fit in log-log space (same method as the report's trendline) to the
# measured attenuation at 2.25, 3.5, 5, 7.5, 10 MHz. R^2 (linear, dB/cm) = 0.9988.
# Valid over 2.25-10 MHz; outside that range it is an extrapolation.
# Measured attenuation (mean +/- std):
#    2.25 MHz: 1.010 +/- 0.010 dB/cm
#    3.50 MHz: 1.600 +/- 0.010 dB/cm
#    5.00 MHz: 2.340 +/- 0.010 dB/cm
#    7.50 MHz: 3.780 +/- 0.010 dB/cm
#   10.00 MHz: 5.300 +/- 0.020 dB/cm
attenuation:
  coef: 0.4011
  exp: 1.1132
  offset: 0.0

# two columns: frequency [MHz], BSC [1/cm-sr]; 1.7-7.9 MHz
bsc:
  file: bsc.txt

# Speed of sound [m/s] at 2.25, 3.5, 5, 7.5, 10 MHz (informational, not used by the loader)
speed_of_sound_m_s: [1539.61, 1540.11, 1540.41, 1541.08, 1541.67]

# Membrane transmission not provided in the calibration report. Add either
#   file: transmission.txt   (two columns: frequency [MHz], amplitude transmission coefficient)
# or
#   thickness_um: <membrane thickness>   (analytic model in bsc_transmission_compensation)
transmission: {}
