name: UCSD S2
description: >
  Calibrated by the UW-Madison Quantitative Ultrasound Lab (Rosado-Mendez),
  QULReport_UCSD_S1S2S3_09302026.pdf (UW-Madison QUL, report date 2026-09-30).
  No through-transmission signal at 10 MHz; attenuation fit uses 2.25-7.5 MHz only.

# attenuation(f) = coef * f_MHz^exp + offset   [dB/cm]
# Power-law least-squares fit in log-log space (same method as the report's trendline) to the
# measured attenuation at 2.25, 3, 5, 7.5 MHz. R^2 (linear, dB/cm) = 0.9984.
# Valid over 2.25-7.5 MHz; outside that range it is an extrapolation.
# Measured attenuation (mean +/- std):
#    2.25 MHz: 1.660 +/- 0.003 dB/cm
#    3.00 MHz: 2.690 +/- 0.010 dB/cm
#    5.00 MHz: 7.000 +/- 0.030 dB/cm
#    7.50 MHz: 15.780 +/- 0.080 dB/cm
attenuation:
  coef: 0.3524
  exp: 1.8744
  offset: 0.0

# two columns: frequency [MHz], BSC [1/cm-sr]; 1.8-7.9 MHz
bsc:
  file: bsc.txt

# Speed of sound [m/s] at 2.25, 3, 5, 7.5 MHz (informational, not used by the loader)
speed_of_sound_m_s: [1538.1, 1537.6, 1535.3, 1532.8]

# Membrane transmission not provided in the calibration report. Add either
#   file: transmission.txt   (two columns: frequency [MHz], amplitude transmission coefficient)
# or
#   thickness_um: <membrane thickness>   (analytic model in bsc_transmission_compensation)
transmission: {}
