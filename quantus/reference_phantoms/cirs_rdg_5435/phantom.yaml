name: CIRS RDG 5435
description: >
  Reference phantom used with the Vevo F2 in the VEVO_F2_QUS MATLAB workflow
  (bsc.txt = CIRS_RDG_5435.txt; attenuation from MainScript.m).

# attenuation(f) = coef * f_MHz^exp + offset   [dB/cm]
attenuation:
  coef: 0.2089
  exp: 1.4183
  offset: 0.2712

# two columns: frequency [MHz], BSC [1/cm-sr]; 2.2-55 MHz
bsc:
  file: bsc.txt

# Membrane transmission not yet calibrated for this phantom. Add either
#   file: transmission.txt   (two columns: frequency [MHz], amplitude transmission coefficient)
# or
#   thickness_um: <membrane thickness>   (analytic model in bsc_transmission_compensation)
transmission: {}
