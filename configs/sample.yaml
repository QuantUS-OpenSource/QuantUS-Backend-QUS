# Screen 1: Workflow type
scan_loader: terason_rf

# Screen 2: Scan inputs
scan_path: PATH/TO/SAVED/SCAN.mat
phantom_path: PATH/TO/SAVED/PHANTOM.mat
scan_loader_kwargs:

# Screen 3: Segmentation (either drawing or saved)
seg_path: PATH/TO/SAVED/SEG.pkl
seg_loader: pkl_roi
seg_loader_kwargs:
  assert_scan: False
  assert_phantom: False

# Screen 4: Analysis Type / Customization
analysis_type: paramap
analysis_kwargs:
  # attenuation_coef
  ref_atten: 0.7                            # Reference phantom attenuation (dB/cm/MHz)
  ref_atten_exp: 1.0
  ref_atten_offset: 0.0
  n_secs: 5
  sec_overlap: 0.5
  n_fft: 8192
  # bsc_single_freq (also uses ref_atten)
  sample_atten: 0.7                         # Assumed sample attenuation (dB/cm/MHz)
  ref_bsc: 0.0006                           # Reference phantom BSC (1/cm-sr)
analysis_funcs:                             # Empty list means no functions
  - attenuation_coef
  - bsc_single_freq
  - lizzi_feleppa

# Screen 5: Analysis Configuration (either from GUI or saved)
config_path: PATH/TO/SAVED/CONFIG.pkl
config_loader: pkl_rf
config_kwargs:
  assert_scan: False
  assert_phantom: False

# Screen 6: Visualization Type / Customization
visualization_type: paramap
visualization_kwargs:
  paramap_folder_path: .quantus/visualization_results   # Relative paths resolve against the repo root
visualization_funcs:                        # Empty list means no additional functions
  - paramaps
  - plot_ps_window_data

# Screen 7: Data Export Type / Customization
data_export_type: csv
data_export_path: test.csv
data_export_funcs:                          # Empty list means no functions
  - descr_vals
